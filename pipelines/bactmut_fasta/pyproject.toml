[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bactmut-fasta"
version = "1.0.0"
description = "Bacterial genome comparison, SNP filtering, and phylogeny pipeline"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "BactMut contributors"}]
dependencies = []

[project.scripts]
bactmut-fasta = "bactmut_fasta.cli:main"

[tool.setuptools.packages.find]
include = ["bactmut_fasta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
