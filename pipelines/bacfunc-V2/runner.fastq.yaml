engine: shell
name: bacfunc-fastq
version: "0.2.0"
description: Gene-level eggNOG annotation from metagenome reads
entrypoint: bacfunc-fastq
configuration: config.yaml
resources:
  cpu: 8
  memory: 32Gi
  temporary_storage: 100Gi
inputs:
  read1:
    type: file
    required: true
    formats: [fastq, fastq.gz]
  read2:
    type: file
    required: false
    formats: [fastq, fastq.gz]
  analysis_mode:
    type: string
    required: false
    default: reads
    enum: [reads, assemble]
  output:
    type: directory
    required: true
  sample_id:
    type: string
    required: false
outputs:
  directory: output
  required: [gene_annotations.tsv, annotation_terms.tsv, status.json, manifest.json, qc.json]
execution:
  interactive: false
  command: bacfunc-fastq --read1 ${inputs.read1} --read2 ${inputs.read2} --analysis-mode ${inputs.analysis_mode} --output ${inputs.output}
