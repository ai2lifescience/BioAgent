engine: shell
name: bacfunc-directory
version: "0.2.0"
description: Gene-level eggNOG batch annotation from a sequence input directory
entrypoint: run.sh
configuration: config.yaml
resources:
  cpu: 8
  memory: 32Gi
  temporary_storage: 100Gi
inputs:
  input_directory:
    type: directory
    required: true
  input_type:
    type: string
    required: false
    default: auto
    enum: [auto, reads, genome]
  analysis_mode:
    type: string
    required: false
    default: auto
    enum: [auto, reads, genome, assemble]
  output:
    type: directory
    required: true
  sample_id:
    type: string
    required: false
outputs:
  directory: output
  layout: single_or_sample_subdirectories
  required_per_sample: [gene_annotations.tsv, annotation_terms.tsv, status.json, manifest.json, qc.json]
execution:
  interactive: false
  command: ./run.sh run --input-dir ${inputs.input_directory} --input-type ${inputs.input_type} --analysis-mode ${inputs.analysis_mode} --output ${inputs.output}
