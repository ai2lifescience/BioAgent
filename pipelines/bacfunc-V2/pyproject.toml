[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bacfunc"
version = "0.2.0"
description = "Metagenome gene-level functional annotation with eggNOG-mapper 2.1.15"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bacfunc = "bacfunc.cli:main"
bacfunc-fasta = "bacfunc.cli:fasta_main"
bacfunc-fastq = "bacfunc.cli:fastq_main"

[tool.setuptools.packages.find]
include = ["bacfunc*"]

[tool.setuptools.package-data]
bacfunc = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
