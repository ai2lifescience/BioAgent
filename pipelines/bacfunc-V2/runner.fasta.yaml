engine: shell
name: bacfunc-fasta
version: "0.2.0"
description: Gene-level eggNOG annotation from supplied metagenome contigs
entrypoint: bacfunc-fasta
configuration: config.yaml
resources:
  cpu: 8
  memory: 24Gi
  temporary_storage: 50Gi
inputs:
  assembly:
    type: file
    required: true
    formats: [fasta, fasta.gz]
  output:
    type: directory
    required: true
  sample_id:
    type: string
    required: false
outputs:
  directory: output
  required: [gene_annotations.tsv, annotation_terms.tsv, status.json, manifest.json, qc.json]
execution:
  interactive: false
  command: bacfunc-fasta --assembly ${inputs.assembly} --output ${inputs.output}
