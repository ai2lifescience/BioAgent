name: generic_shell
engine: shell
config: config.yaml
entrypoint: run.sh
timeout: 120
inputs:
  reads:
    label: Sequence data
    config_key: input_path
    required: true
    accepts: [".txt", ".fastq", ".fq", ".fasta", ".fa"]
  metadata:
    label: Subtype metadata
    config_key: metadata_path
    required: true
    accepts: [".tsv", ".csv"]
outputs:
  report:
    label: Report
    config_key: report_path
    default: output/report.md
    kind: report
    required: true
  metrics:
    label: Metrics
    config_key: metrics_path
    default: output/metrics.json
    kind: metrics
    required: true
  normalized_text:
    label: Normalized text
    config_key: normalized_path
    default: output/normalized.txt
    kind: text
    required: true
  subtype_assignments:
    label: Sequence subtype assignments
    config_key: subtype_path
    default: output/subtypes.tsv
    kind: table
    required: true
