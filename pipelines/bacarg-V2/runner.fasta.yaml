engine: shell
name: bacarg-fasta
version: "0.2.0"
description: MEGARes 3.0 ARG annotation from supplied metagenome contigs
entrypoint: bacarg-fasta
configuration: config.yaml
resources:
  cpu: 8
  memory: 16Gi
  temporary_storage: 20Gi
inputs:
  assembly:
    type: file
    required: true
    formats: [fasta, fasta.gz]
  output:
    type: directory
    required: true
  sample_id:
    type: string
    required: false
outputs:
  directory: output
  required: [arg_hits.tsv, arg_hits.jsonl, status.json, manifest.json, qc.json]
execution:
  interactive: false
  command: bacarg-fasta --assembly ${inputs.assembly} --output ${inputs.output}
