schema_version: '1.0'
pipeline:
  threads: 8
  sample_type: metagenome
runtime:
  keep_work: true
  strict_manifest: false
tools:
  trimmomatic:
    executable: trimmomatic
    prefix_options: []
    options:
    - LEADING:3
    - TRAILING:3
    - SLIDINGWINDOW:4:15
    - MINLEN:36
  reads_mapper:
    executable: minimap2
    prefix_options: []
    options: [-x, sr, --secondary=no]
    min_identity: 80
    min_coverage: 60
    min_mapq: 10
    min_alignment_length: 30
    min_supporting_reads: 2
  assembler:
    executable: metaspades.py
    prefix_options: []
    options: []
    include_unpaired: false
    memory_gb: null
  prokka:
    executable: prokka
    prefix_options: []
    options:
    - --kingdom
    - Bacteria
    - --metagenome
  abricate:
    executable: abricate
    prefix_options: []
    database_name: megares_v3
    database_version: '3.0'
    min_identity: 80
    min_coverage: 60
databases:
  abricate_datadir: /data/wutt/xjp/BioAgent-clean/databases/bacarg/abricate
  metadata: /data/wutt/xjp/BioAgent-clean/databases/bacarg/abricate/megares_v3/metadata.normalized.tsv
  manifest: /data/wutt/xjp/BioAgent-clean/databases/bacarg/abricate/megares_v3/database_manifest.json
metadata_fields: {}
