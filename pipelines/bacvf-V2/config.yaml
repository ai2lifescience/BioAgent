label: bacvf_v2_example
input_path: data/input/example_contigs.fasta
output_dir: data/output
vf_hits_path: data/output/vf_hits.tsv
vf_hits_jsonl_path: data/output/vf_hits.jsonl
qc_path: data/output/qc.json
status_path: data/output/status.json
input_type: genome
analysis_mode: genome
threads: 1
sample_id: example

schema_version: "1.0"

pipeline:
  threads: 32
  sample_type: metagenome

runtime:
  keep_work: true
  strict_manifest: false

tools:
  trimmomatic:
    executable: trimmomatic
    prefix_options: []
    options:
      - LEADING:3
      - TRAILING:3
      - SLIDINGWINDOW:4:15
      - MINLEN:36
  reads_mapper:
    executable: minimap2
    prefix_options: []
    options: [-x, sr, --secondary=no]
    min_identity: 80
    min_coverage: 60
    min_mapq: 10
    min_alignment_length: 30
    min_supporting_reads: 2
  assembler:
    executable: metaspades.py
    prefix_options: []
    options: []
    include_unpaired: false
    memory_gb:
  prokka:
    executable: prokka
    prefix_options: []
    options:
      - --kingdom
      - Bacteria
      - --metagenome
  abricate:
    executable: abricate
    prefix_options: []
    database_name: vfdb_core
    database_version: "core"
    min_identity: 80
    min_coverage: 60

databases:
  abricate_datadir:
  metadata:
  manifest:

metadata_fields: {}
