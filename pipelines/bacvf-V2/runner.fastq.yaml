engine: shell
name: bacvf-fastq
version: "0.2.0"
description: VFDB core virulence-factor annotation from metagenome reads
entrypoint: bacvf-fastq
configuration: config.yaml
resources:
  cpu: 8
  memory: 32Gi
  temporary_storage: 100Gi
inputs:
  read1:
    type: file
    required: true
    formats: [fastq, fastq.gz]
  read2:
    type: file
    required: false
    formats: [fastq, fastq.gz]
  analysis_mode:
    type: string
    required: false
    default: reads
    enum: [reads, assemble]
  output:
    type: directory
    required: true
  sample_id:
    type: string
    required: false
outputs:
  directory: output
  required: [vf_hits.tsv, vf_hits.jsonl, status.json, manifest.json, qc.json]
execution:
  interactive: false
  command: bacvf-fastq --read1 ${inputs.read1} --read2 ${inputs.read2} --analysis-mode ${inputs.analysis_mode} --output ${inputs.output}
