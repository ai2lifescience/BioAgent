name: bacvf-v2
engine: shell
config: config.yaml
entrypoint: run.sh
timeout: 3600

inputs:
  input_data:
    label: Input file or directory
    config_key: input_path
    required: true

outputs:
  vf_hits:
    label: Virulence-factor hits table
    config_key: vf_hits_path
    default: output/vf_hits.tsv
    kind: table
    required: true

  vf_hits_jsonl:
    label: Virulence-factor hits JSONL
    config_key: vf_hits_jsonl_path
    default: output/vf_hits.jsonl
    kind: report
    required: false

  qc:
    label: Quality-control summary
    config_key: qc_path
    default: output/qc.json
    kind: report
    required: true

  status:
    label: Pipeline status
    config_key: status_path
    default: output/status.json
    kind: report
    required: true

param_overrides:
  input_type:
    config_key: input_type
    default: auto
  analysis_mode:
    config_key: analysis_mode
    default: auto
  threads:
    config_key: threads
    default: 8
  sample_id:
    config_key: sample_id
    default: ""
