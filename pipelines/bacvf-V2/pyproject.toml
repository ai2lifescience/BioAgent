[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bacvf"
version = "0.2.0"
description = "Metagenome VFDB core sequence-homology virulence-factor homolog annotation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bacvf = "bacvf.cli:main"
bacvf-fasta = "bacvf.cli:fasta_main"
bacvf-fastq = "bacvf.cli:fastq_main"

[tool.setuptools.packages.find]
include = ["bacvf*"]

[tool.setuptools.package-data]
bacvf = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
