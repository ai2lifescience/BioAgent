[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bactmut-fastq"
version = "1.0.0"
description = "bcftools-based bacterial FASTQ variant and phylogeny pipeline"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "BactMut contributors"}]
dependencies = []

[project.scripts]
bactmut-fastq = "bactmut_fastq.cli:main"

[tool.setuptools.packages.find]
include = ["bactmut_fastq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
