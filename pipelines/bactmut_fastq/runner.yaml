name: bactmut_fastq
engine: shell
config: config.yaml
entrypoint: run.sh
timeout: 28800

inputs:
  reads:
    label: FASTQ read directory
    config_key: input_path
    required: true
    accepts: [".fastq", ".fq", ".fastq.gz", ".fq.gz"]

  reference:
    label: Reference genome FASTA (required when reference_mode is local)
    config_key: reference_path
    required: false
    accepts: [".fasta", ".fa", ".fna", ".fas"]

outputs:
  report:
    label: BioAgent Markdown report
    config_key: report_path
    default: data/output/report.md
    kind: report
    required: true

  metrics:
    label: BioAgent metrics
    config_key: metrics_path
    default: data/output/metrics.json
    kind: metrics
    required: true

  matrix:
    label: Filtered SNP matrix
    config_key: matrix_path
    default: data/output/matrix.tsv
    kind: table
    required: true

  variants:
    label: Annotated variants
    config_key: variants_path
    default: data/output/variants.tsv
    kind: table
    required: true

  variants_summary:
    label: Variant statistics
    config_key: variants_summary_path
    default: data/output/variants_summary.txt
    kind: report
    required: true

  final_tree:
    label: Final phylogenetic tree
    config_key: final_tree_path
    default: data/output/final_tree.nwk
    kind: tree
    required: false

  tree_alignment:
    label: Tree alignment
    config_key: tree_alignment_path
    default: data/output/tree.fasta
    kind: fasta
    required: false

  treefile:
    label: IQ-TREE tree
    config_key: treefile_path
    default: data/output/tree.treefile
    kind: tree
    required: false

  iqtree_report:
    label: IQ-TREE report
    config_key: iqtree_report_path
    default: data/output/tree.iqtree
    kind: report
    required: false

  iqtree_log:
    label: IQ-TREE log
    config_key: iqtree_log_path
    default: data/output/tree.log
    kind: report
    required: false

  pipeline_log:
    label: Pipeline execution log
    config_key: pipeline_log_path
    default: data/output/pipeline.log
    kind: report
    required: false

param_overrides:
  reference_mode: {}
  species: {}
  taxonid: {}
  threads: {}
  min_coverage: {}
  window_size: {}
  step_size: {}
  sd_threshold: {}
  verbose: {}
