name: metagenomics_toolkit
engine: nextflow
config: config.yaml
workflow: main.nf
nextflow_config: nextflow.config
workflow_root_env: METAGENOMICS_TK_PATH
workflow_root_default: source/metagenomics-tk-master/metagenomics-tk-master
profile: standard
nextflow_version: 25.10.4
resume: true
nextflow_args: ["--publishDirMode", "copy"]
timeout: 0
runtime_adapter: adapter.py
post_run_adapter: adapter.py
default_output_dir: output
allowed_entries:
  - wFullPipeline
  - wShortReadQualityControl
  - wOntQualityControl
  - wShortReadAssembly
  - wOntAssembly
  - wShortReadBinning
  - wOntBinning
  - wMultiBinningShortRead
  - wMultiBinningLongRead
  - wMagAttributes
  - wAnnotate
  - wPlasmids
  - wFragmentRecruitment
  - wMetabolomics
  - wDereplication
  - wReadMapping
  - wCooccurrence
  - wExportPipeline
inputs:
  params_file:
    label: Toolkit parameter YAML
    config_key: params_file
    required: true
    accepts: [".yaml", ".yml"]
    description: Native Metagenomics-Toolkit parameter file for a full or standalone run.
param_overrides:
  execution_mode:
    label: Execution mode
    config_key: params.execution_mode
    default: full
    choices: [full, standalone]
  module:
    label: Standalone module
    config_key: params.module
    default: ""
    choices:
      - qc
      - qc_ont
      - assembly
      - assembly_ont
      - binning
      - binning_ont
      - multi_binning
      - multi_binning_ont
      - mag_attributes
      - annotation
      - plasmids
      - fragment_recruitment
      - metabolomics
      - dereplication
      - read_mapping
      - cooccurrence
      - export
outputs:
  results:
    label: Toolkit results
    config_key: output
    default: output/results
    kind: directory
    required: true
  logs:
    label: Nextflow and toolkit logs
    config_key: logDir
    default: output/logs
    kind: directory
    required: true
  report:
    label: BioAgent run report
    config_key: report_path
    default: output/report.md
    kind: report
    required: true
  metrics:
    label: BioAgent run metrics
    config_key: metrics_path
    default: output/metrics.json
    kind: metrics
    required: true
