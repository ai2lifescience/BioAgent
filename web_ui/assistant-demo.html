<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistant Embed Demo</title>
<style>
body{margin:0;background:#f3f7f6;color:#173438;font:15px system-ui,sans-serif}main{max-width:1080px;margin:32px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:center}section{background:white;border:1px solid #d9e5e4;border-radius:14px;padding:20px;margin-top:20px;box-shadow:0 8px 24px #17343810}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e4eceb}svg{width:100%;height:220px;background:#f8fbfb;border-radius:8px}.pill{border:0;border-radius:999px;padding:9px 14px;background:#dff2ef;color:#115e59;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
<main><header><div><h1>Sample comparison</h1><p>Independent website fixture: filter, inspect data, and ask the embedded guide.</p></div><button class="pill" id="filter">Show treated</button></header>
<section class="grid"><div><h2>Relative abundance</h2><svg id="chart" viewBox="0 0 500 220" role="img" aria-label="Relative abundance chart"><polyline points="20,185 110,130 200,150 290,80 380,105 470,45" fill="none" stroke="#159487" stroke-width="5"/><circle cx="290" cy="80" r="7" fill="#115e59"/></svg></div><div><h2>Measurements</h2><table id="measurements"><thead><tr><th>Sample</th><th>Group</th><th>Score</th></tr></thead><tbody></tbody></table></div></section>
<section><h2>Workflow</h2><p id="workflow">Step 2 of 3: review the comparison.</p><button class="pill" id="methods">Open methods</button></section><div id="assistant-root"></div></main>
<script>
const rows=[{sample:"S1",group:"control",score:0.42},{sample:"S2",group:"treated",score:0.81},{sample:"S3",group:"treated",score:0.67},{sample:"S4",group:"control",score:0.31}];let group="all",revision=1;
function render(){document.querySelector("#measurements tbody").innerHTML=rows.filter(r=>group==="all"||r.group===group).map(r=>"<tr><td>"+r.sample+"</td><td>"+r.group+"</td><td>"+r.score+"</td></tr>").join("");document.querySelector("#filter").textContent=group==="all"?"Show treated":"Show all"} render();
document.querySelector("#filter").onclick=()=>{group=group==="all"?"treated":"all";revision++;render();assistant&&assistant.updateContext(pageContext())};document.querySelector("#methods").onclick=()=>{location.hash="methods";revision++;assistant&&assistant.updateContext(pageContext())};
function pageContext(){return {revision:"comparison-"+revision,title:"Sample comparison",url:location.href,selection:{group:group},filters:{group:group},workflow:{step:"review",steps:["select","review","export"]},resources:[{id:"measurements",kind:"table",title:"Measurements",exportable:true},{id:"abundance",kind:"figure",title:"Relative abundance"}],elements:[{id:"measurements",label:"Measurements table"},{id:"filter",label:"Group filter"}],routes:[{id:"methods",label:"Methods"}],actions:[{id:"set_group",description:"Filter group",parameters:{group:["all","treated","control"]}}],manual:{version:"2026-09",title:"Example user manual"}}}
const dataFor=()=>rows.filter(r=>group==="all"||r.group===group);let assistant;
(async()=>{const s=document.createElement("script");s.src="/static/assistant-embed.js";document.head.append(s);await new Promise(r=>s.onload=r);assistant=AssistantDrawer.mount({target:document.querySelector("#assistant-root"),src:"/assistant",siteId:"assistant-demo",getToken:()=>fetch("/website/demo-token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({site_id:"assistant-demo"})}).then(r=>r.json()).then(x=>x.token),context:pageContext(),adapter:{getPageContext:pageContext,readTable:({resource_id,offset=0,limit=50})=>resource_id==="measurements"?{resource_id:resource_id,title:"Measurements",columns:[{name:"sample",type:"string"},{name:"group",type:"string"},{name:"score",type:"number"}],rows:dataFor().slice(offset,offset+limit),offset:offset,total_rows:dataFor().length,revision:"comparison-"+revision}:{},readFigure:({resource_id})=>({resource_id:resource_id,title:"Relative abundance",description:"Six ordered observations; teal line is the current sample comparison.",x_axis:{label:"Observation",unit:""},y_axis:{label:"Relative abundance",unit:"fraction"},series:[{name:"Observed",values:[.12,.31,.24,.55,.43,.72]}],revision:"comparison-"+revision}),searchManual:({query})=>({version:"2026-09",sections:[{id:"methods",title:"Methods",excerpt:"This page uses a " + query + " workflow."}]}),readManual:()=>({section_id:"methods",title:"Methods",version:"2026-09",text:"Use the filter to change cohort, then inspect Measurements. Export data when an analysis needs the complete table."}),exportData:()=>({filename:"measurements.csv",content:"sample,group,score\n"+dataFor().map(r=>r.sample+","+r.group+","+r.score).join("\n"),content_type:"text/csv"}),highlight:({element_id,message})=>{document.getElementById(element_id)&&document.getElementById(element_id).scrollIntoView({behavior:"smooth"});return {message:message||("Highlighted "+element_id),revision:"comparison-"+revision}},navigate:({route_id})=>{location.hash=route_id;return {message:"Opened "+route_id,revision:"comparison-"+revision}},invokeAction:({action_id,arguments:a})=>{if(action_id==="set_group"){group=["all","treated","control"].includes(a.group)?a.group:"all";revision++;render();return {action_id:action_id,message:"Group set to "+group,revision:"comparison-"+revision}}throw new Error("Unknown action")}}})})();
</script>
