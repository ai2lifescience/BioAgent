<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant</title>
  <link rel="stylesheet" href="./static/assistant.css">
</head>
<body>
  <main class="assistant-app" aria-label="Assistant">
    <header class="assistant-header">
      <div class="assistant-brand">
        <span class="brand-mark" role="img" aria-label="Assistant">
          <svg viewBox="0 0 512 512" fill="none" aria-hidden="true">
            <defs><linearGradient id="bsod-screen-assistant-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#159BEA"/><stop offset="1" stop-color="#1486D8"/></linearGradient></defs>
            <path d="M256 112c-4-38 10-58 34-67" stroke="#25283A" stroke-width="10" stroke-linecap="round"/>
            <circle cx="300" cy="40" r="18" fill="#159BEA" stroke="#25283A" stroke-width="8"/>
            <rect x="79" y="164" width="35" height="118" rx="17" fill="#D3D2D1" stroke="#25283A" stroke-width="9"/>
            <rect x="398" y="164" width="35" height="118" rx="17" fill="#D3D2D1" stroke="#25283A" stroke-width="9"/>
            <rect x="101" y="126" width="310" height="213" rx="48" fill="url(#bsod-screen-assistant-2)" stroke="#25283A" stroke-width="10"/>
            <path d="M128 162c23-19 52-27 87-27h94c34 0 62 8 77 25" stroke="#63C6F3" stroke-width="9" stroke-linecap="round" opacity=".7"/>
            <rect x="181" y="204" width="13" height="52" rx="6.5" fill="#202332"/>
            <rect x="318" y="204" width="13" height="52" rx="6.5" fill="#202332"/>
            <ellipse cx="166" cy="275" rx="23" ry="12" fill="#F58FAE"/>
            <ellipse cx="346" cy="275" rx="23" ry="12" fill="#F58FAE"/>
            <path d="M241 275c7 9 23 9 30 0" stroke="#63D2F5" stroke-width="8" stroke-linecap="round"/>
            <path d="M104 319c-23 17-28 44-14 61 9 11 23 11 30 1l20-31" fill="#D3D2D1" stroke="#25283A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M408 319c23 17 28 44 14 61-9 11-23 11-30 1l-20-31" fill="#D3D2D1" stroke="#25283A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="171" y="331" width="170" height="105" rx="25" fill="#F1F0ED" stroke="#25283A" stroke-width="9"/>
            <rect x="224" y="352" width="64" height="53" rx="8" fill="#168EDC" stroke="#25283A" stroke-width="7"/>
            <rect x="244" y="368" width="24" height="18" rx="3" fill="#82D8F5"/>
            <path d="M190 433v39c0 9 7 16 16 16h31v-55" fill="#C9C8C6" stroke="#25283A" stroke-width="9" stroke-linejoin="round"/>
            <path d="M322 433v39c0 9-7 16-16 16h-31v-55" fill="#C9C8C6" stroke="#25283A" stroke-width="9" stroke-linejoin="round"/>
          </svg>
        </span>
        <div><strong>Assistant</strong><small>Your analysis companion</small></div>
      </div>
      <button id="newChat" class="text-button" type="button">New chat</button>
    </header>

    <div id="contextSummary" class="context-summary" aria-label="Current workspace context" aria-live="polite" hidden></div>

    <div id="messages" class="messages" role="log" aria-label="Conversation" aria-live="polite" tabindex="0">
      <div class="welcome">
        <div class="welcome-mark" role="img" aria-label="Assistant">
          <svg viewBox="0 0 512 512" fill="none" aria-hidden="true">
            <defs><linearGradient id="bsod-screen-page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#159BEA"/><stop offset="1" stop-color="#1486D8"/></linearGradient></defs>
            <path d="M256 112c-4-38 10-58 34-67" stroke="#25283A" stroke-width="10" stroke-linecap="round"/>
            <circle cx="300" cy="40" r="18" fill="#159BEA" stroke="#25283A" stroke-width="8"/>
            <rect x="79" y="164" width="35" height="118" rx="17" fill="#D3D2D1" stroke="#25283A" stroke-width="9"/>
            <rect x="398" y="164" width="35" height="118" rx="17" fill="#D3D2D1" stroke="#25283A" stroke-width="9"/>
            <rect x="101" y="126" width="310" height="213" rx="48" fill="url(#bsod-screen-page)" stroke="#25283A" stroke-width="10"/>
            <path d="M128 162c23-19 52-27 87-27h94c34 0 62 8 77 25" stroke="#63C6F3" stroke-width="9" stroke-linecap="round" opacity=".7"/>
            <rect x="181" y="204" width="13" height="52" rx="6.5" fill="#202332"/>
            <rect x="318" y="204" width="13" height="52" rx="6.5" fill="#202332"/>
            <ellipse cx="166" cy="275" rx="23" ry="12" fill="#F58FAE"/>
            <ellipse cx="346" cy="275" rx="23" ry="12" fill="#F58FAE"/>
            <path d="M241 275c7 9 23 9 30 0" stroke="#63D2F5" stroke-width="8" stroke-linecap="round"/>
            <path d="M104 319c-23 17-28 44-14 61 9 11 23 11 30 1l20-31" fill="#D3D2D1" stroke="#25283A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M408 319c23 17 28 44 14 61-9 11-23 11-30 1l-20-31" fill="#D3D2D1" stroke="#25283A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="171" y="331" width="170" height="105" rx="25" fill="#F1F0ED" stroke="#25283A" stroke-width="9"/>
            <rect x="224" y="352" width="64" height="53" rx="8" fill="#168EDC" stroke="#25283A" stroke-width="7"/>
            <rect x="244" y="368" width="24" height="18" rx="3" fill="#82D8F5"/>
            <path d="M190 433v39c0 9 7 16 16 16h31v-55" fill="#C9C8C6" stroke="#25283A" stroke-width="9" stroke-linejoin="round"/>
            <path d="M322 433v39c0 9-7 16-16 16h-31v-55" fill="#C9C8C6" stroke="#25283A" stroke-width="9" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>How can I help?</h1>
        <p>Ask about your results or attach a file to get started.</p>
        <button id="welcomePrompt" class="suggestion" type="button">Help me understand a results table</button>
      </div>
    </div>

    <div class="progress-area">
      <div id="status" class="status" role="status">Connecting to assistant…</div>
      <button id="retryConfig" class="text-button" type="button" hidden>Retry connection</button>
      <button id="retryWebsite" class="text-button" type="button" hidden>Retry website connection</button>
      <details id="progressDetails" hidden>
        <summary>Activity</summary>
        <pre id="progressLog"></pre>
      </details>
    </div>

    <form id="composer" class="composer">
      <ul id="uploadList" class="file-list" aria-label="Attached files" hidden></ul>
      <label class="sr-only" for="prompt">Message assistant</label>
      <textarea id="prompt" rows="2" placeholder="Ask assistant…"></textarea>
      <div class="model-control">
        <label for="model">Model</label>
        <select id="model" disabled><option>Connecting…</option></select>
      </div>
      <div class="composer-actions">
        <button id="attachButton" class="attach-button" type="button" aria-label="Attach files">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <path d="m8 13 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          Attach
        </button>
        <input id="uploadInput" type="file" multiple hidden>
        <button id="stop" class="stop-button" type="button" hidden disabled>Stop waiting</button>
        <button id="send" class="primary-button" type="submit" disabled>Send <span aria-hidden="true">↑</span></button>
      </div>
    </form>
  </main>
  <script src="./static/markdown.js"></script>
  <script src="./static/approvals.js"></script>
  <script src="./static/assistant.js"></script>
</body>
</html>
