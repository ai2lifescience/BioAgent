<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380" role="img" aria-labelledby="title desc">
  <title id="title">BioAgent system architecture</title>
  <desc id="desc">All interfaces call harness.run_bioagent. The OpenAI Agents SDK Runner exchanges model requests with OpenRouter, persists conversations in SQLiteSession, and invokes twelve workflow function tools or three specialist agents as tools. Workflows execute registered actions. Guardrails, local tracing, evidence collection, verification, and backend artifact storage support the runtime.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#456987"/></marker>
    <style>
      text {font-family: 'DejaVu Sans', sans-serif; fill: #152e43;}
      .title {font-size: 44px; font-weight: 700;}
      .sub {font-size: 23px; fill: #526b7f;}
      .heading {font-size: 30px; font-weight: 700;}
      .body {font-size: 23px;}
      .small {font-size: 20px; fill: #526b7f;}
      .code {font-family: 'DejaVu Sans Mono', monospace; font-size: 22px;}
      .link {fill: none; stroke: #456987; stroke-width: 3; marker-end: url(#arrow);}
      .both {marker-start: url(#arrow);}
      .aside {fill: none; stroke: #8096a7; stroke-width: 2; stroke-dasharray: 7 6;}
    </style>
  </defs>
  <path fill="#f7fafc" d="M0 0H1800V1380H0Z"/>
  <text x="72" y="72" class="title">BioAgent system architecture</text>
  <text x="72" y="113" class="sub">One Agents SDK runtime connects models, biological workflows, and persistent sessions.</text>

  <rect x="72" y="151" width="1656" height="80" rx="16" fill="#ffffff" stroke="#c3d0da" stroke-width="2"/>
  <text x="110" y="201" class="heading">Interfaces</text>
  <text x="630" y="201" class="body">Web</text><text x="850" y="201" class="body">CLI</text>
  <text x="1070" y="201" class="body">API</text><text x="1290" y="201" class="body">Python / notebook</text>
  <path d="M900 231V267" class="link"/>
  <rect x="490" y="267" width="820" height="70" rx="14" fill="#eaf1ff" stroke="#769adb" stroke-width="2"/>
  <text x="900" y="311" text-anchor="middle" class="code">harness.run_bioagent()</text>
  <path d="M900 337V382" class="link"/>

  <rect x="490" y="382" width="820" height="178" rx="20" fill="#173c60"/>
  <text x="900" y="432" text-anchor="middle" class="heading" style="fill:#ffffff">BioAgent: Agent + Runner</text>
  <text x="900" y="473" text-anchor="middle" class="body" style="fill:#d9e8f4">Model turns and tool execution managed by the SDK</text>
  <rect x="534" y="499" width="367" height="40" rx="10" fill="#2a5479"/>
  <text x="717" y="526" text-anchor="middle" class="small" style="fill:#ffffff">Input / output guardrails</text>
  <rect x="923" y="499" width="343" height="40" rx="10" fill="#2a5479"/>
  <text x="1094" y="526" text-anchor="middle" class="small" style="fill:#ffffff">Local SDK tracing + hooks</text>

  <rect x="72" y="389" width="354" height="164" rx="18" fill="#eaf7f2" stroke="#79b8a0" stroke-width="2"/>
  <text x="99" y="433" class="heading" style="font-size:27px">SDK SQLiteSession</text>
  <text x="99" y="476" class="body">Conversation history</text>
  <text x="99" y="518" class="small">Stored on the backend host</text>
  <path d="M426 453H490" class="link both"/>
  <rect x="1374" y="389" width="354" height="164" rx="18" fill="#f0edfa" stroke="#a997cf" stroke-width="2"/>
  <text x="1401" y="433" class="heading" style="font-size:27px">OpenAI Python client</text>
  <text x="1401" y="476" class="body">OpenRouter</text>
  <text x="1401" y="518" class="small">Chat Completions requests</text>
  <path d="M1310 453H1374" class="link both"/>

  <path d="M900 560V608" class="link both"/>
  <rect x="490" y="608" width="820" height="154" rx="18" fill="#e8f5f7" stroke="#71aeb9" stroke-width="2"/>
  <text x="900" y="653" text-anchor="middle" class="heading">12 workflow FunctionTools</text>
  <text x="900" y="695" text-anchor="middle" class="body">3 specialist agents exposed through Agent.as_tool</text>
  <text x="900" y="734" text-anchor="middle" class="small">Sequence · retrieval · pipeline specialists call workflow subsets</text>

  <rect x="72" y="609" width="354" height="179" rx="18" fill="#ffffff" stroke="#c3d0da" stroke-width="2"/>
  <text x="99" y="652" class="heading" style="font-size:27px">Session workspace</text>
  <text x="99" y="696" class="body">JSON metadata</text>
  <text x="99" y="733" class="body">Uploads + generated files</text>
  <text x="99" y="769" class="small">Backend disk · reused by tools</text>
  <path d="M426 697H490" class="aside"/>
  <rect x="1374" y="609" width="354" height="179" rx="18" fill="#ffffff" stroke="#c3d0da" stroke-width="2"/>
  <text x="1401" y="652" class="heading" style="font-size:27px">Argument validation</text>
  <text x="1401" y="696" class="body">Workflow JSON Schema</text>
  <text x="1401" y="733" class="body">checked before handlers</text>
  <text x="1401" y="769" class="small">Invalid arguments return errors</text>
  <path d="M1310 697H1374" class="aside"/>

  <path d="M900 762V806" class="link"/>
  <rect x="490" y="806" width="820" height="80" rx="16" fill="#ffffff" stroke="#b3c6d4" stroke-width="2"/>
  <text x="900" y="841" text-anchor="middle" class="code">WorkflowContext → ActionExecutor</text>
  <text x="900" y="872" text-anchor="middle" class="small">Workflow action allowlists · required action input checks</text>
  <path d="M900 886V930" class="link"/>

  <rect x="72" y="930" width="1656" height="151" rx="18" fill="#fff8ec" stroke="#d9b779" stroke-width="2"/>
  <text x="900" y="973" text-anchor="middle" class="heading">Registered action implementations</text>
  <path d="M624 994V1060M1176 994V1060" stroke="#e1cba4" stroke-width="2"/>
  <text x="348" y="1019" text-anchor="middle" class="body">Biological data + reporting</text>
  <text x="348" y="1054" text-anchor="middle" class="small">Database APIs · literature · RAG · synthesis</text>
  <text x="900" y="1019" text-anchor="middle" class="body">Deterministic analysis + files</text>
  <text x="900" y="1054" text-anchor="middle" class="small">Sequence · BLAST · genome · structure</text>
  <text x="1452" y="1019" text-anchor="middle" class="body">Registered pipeline execution</text>
  <text x="1452" y="1054" text-anchor="middle" class="small">Shell · Snakemake · Nextflow · WDL</text>
  <path d="M900 1081V1120" class="link"/>
  <rect x="490" y="1120" width="820" height="70" rx="14" fill="#ffffff" stroke="#b3c6d4" stroke-width="2"/>
  <text x="900" y="1164" text-anchor="middle" class="body">Evidence collection + result verification</text>
  <path d="M900 1190V1229" class="link"/>
  <rect x="72" y="1229" width="1656" height="81" rx="18" fill="#eaf7f2" stroke="#79b8a0" stroke-width="2"/>
  <text x="900" y="1280" text-anchor="middle" class="heading">Answer · evidence · verification · trace events · artifact references</text>
  <text x="72" y="1346" class="small">Conversation and file storage persist on the backend host. Local trace events describe the current run.</text>
</svg>
