<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">BioAgent capabilities</title>
  <desc id="desc">BioAgent provides data retrieval, sequence and genome analysis, protein structure analysis, species reports, file inspection, and registered pipeline execution and result collection. Twelve workflows, including a diagnostic example skill, are available as SDK tools. Sequence, retrieval, and pipeline specialist agents are also available as tools.</desc>
  <defs>
    <style>
      text {font-family: 'DejaVu Sans', sans-serif; fill: #152e43;}
      .title {font-size: 44px; font-weight: 700;}
      .sub {font-size: 23px; fill: #526b7f;}
      .heading {font-size: 29px; font-weight: 700;}
      .body {font-size: 23px;}
      .small {font-size: 20px; fill: #526b7f;}
      .code {font-family: 'DejaVu Sans Mono', monospace; font-size: 21px; fill: #365a73;}
      .badge {font-size: 23px; fill: #ffffff; font-weight: 700;}
    </style>
  </defs>
  <path fill="#f7fafc" d="M0 0H1800V1260H0Z"/>
  <text x="72" y="72" class="title">BioAgent capabilities</text>
  <text x="72" y="113" class="sub">12 registered workflows · 3 specialist agents · persistent conversations and artifacts</text>
  <rect x="72" y="151" width="1656" height="79" rx="16" fill="#173c60"/>
  <text x="110" y="201" class="body" style="fill:#ffffff">Web · CLI · API · Python / notebooks</text>
  <text x="1667" y="201" text-anchor="end" class="body" style="fill:#d9e8f4">Agent + Runner · OpenAI client · OpenRouter</text>

  <rect x="72" y="274" width="524" height="269" rx="20" fill="#eaf7f2" stroke="#9dcbb9" stroke-width="2"/>
  <rect x="100" y="302" width="49" height="43" rx="11" fill="#287b61"/><text x="124" y="332" text-anchor="middle" class="badge">01</text>
  <text x="168" y="333" class="heading">Biological data</text>
  <text x="100" y="384" class="body">Retrieve database records and</text>
  <text x="100" y="420" class="body">download NCBI and PDB data.</text>
  <text x="100" y="469" class="code">ncbi_retrieval · database_lookup</text>
  <text x="100" y="505" class="code">pdb_download</text>

  <rect x="638" y="274" width="524" height="269" rx="20" fill="#eaf1ff" stroke="#a4bce5" stroke-width="2"/>
  <rect x="666" y="302" width="49" height="43" rx="11" fill="#3565a9"/><text x="690" y="332" text-anchor="middle" class="badge">02</text>
  <text x="734" y="333" class="heading">Sequence + genome</text>
  <text x="666" y="384" class="body">Calculate sequence statistics,</text>
  <text x="666" y="420" class="body">run BLAST, and plot genome maps.</text>
  <text x="666" y="469" class="code">sequence_analysis · blast_search</text>
  <text x="666" y="505" class="code">genome_map</text>

  <rect x="1204" y="274" width="524" height="269" rx="20" fill="#f0edfa" stroke="#bdafd9" stroke-width="2"/>
  <rect x="1232" y="302" width="49" height="43" rx="11" fill="#76569f"/><text x="1256" y="332" text-anchor="middle" class="badge">03</text>
  <text x="1300" y="333" class="heading">Protein structure</text>
  <text x="1232" y="384" class="body">Analyze PDB / mmCIF structures</text>
  <text x="1232" y="420" class="body">and report structural measurements.</text>
  <text x="1232" y="486" class="code">protein_structure_analysis</text>

  <rect x="72" y="583" width="524" height="269" rx="20" fill="#eaf7f2" stroke="#9dcbb9" stroke-width="2"/>
  <rect x="100" y="611" width="49" height="43" rx="11" fill="#287b61"/><text x="124" y="641" text-anchor="middle" class="badge">04</text>
  <text x="168" y="642" class="heading">Species reports</text>
  <text x="100" y="693" class="body">Combine PubMed, trusted web,</text>
  <text x="100" y="729" class="body">RAG, citations, and model synthesis.</text>
  <text x="100" y="795" class="code">species_report</text>

  <rect x="638" y="583" width="524" height="269" rx="20" fill="#eaf1ff" stroke="#a4bce5" stroke-width="2"/>
  <rect x="666" y="611" width="49" height="43" rx="11" fill="#3565a9"/><text x="690" y="641" text-anchor="middle" class="badge">05</text>
  <text x="734" y="642" class="heading">File inspection</text>
  <text x="666" y="693" class="body">Inspect uploaded text, tabular,</text>
  <text x="666" y="729" class="body">and sequence files.</text>
  <text x="666" y="795" class="code">file_inspection</text>

  <rect x="1204" y="583" width="524" height="269" rx="20" fill="#fff8ec" stroke="#ddc18b" stroke-width="2"/>
  <rect x="1232" y="611" width="49" height="43" rx="11" fill="#a97725"/><text x="1256" y="641" text-anchor="middle" class="badge">06</text>
  <text x="1300" y="642" class="heading">Pipelines + results</text>
  <text x="1232" y="693" class="body">Run registered Shell, Snakemake,</text>
  <text x="1232" y="729" class="body">Nextflow / WDL; collect outputs.</text>
  <text x="1232" y="795" class="code">pipeline_runner · pipeline_results</text>

  <rect x="72" y="898" width="1656" height="105" rx="18" fill="#ffffff" stroke="#b3c6d4" stroke-width="2"/>
  <text x="110" y="941" class="heading">Specialist agents</text>
  <text x="110" y="978" class="small">SDK Agent.as_tool</text>
  <text x="596" y="963" class="body">Sequence</text><text x="975" y="963" class="body">Retrieval</text><text x="1354" y="963" class="body">Pipelines</text>

  <rect x="72" y="1040" width="670" height="146" rx="18" fill="#ffffff" stroke="#b3c6d4" stroke-width="2"/>
  <text x="110" y="1085" class="heading">Continue across turns</text>
  <text x="110" y="1128" class="body">SQLite conversation history and reusable</text>
  <text x="110" y="1163" class="body">uploads / artifacts in the same session.</text>
  <rect x="780" y="1040" width="948" height="146" rx="18" fill="#eaf7f2" stroke="#9dcbb9" stroke-width="2"/>
  <text x="818" y="1085" class="heading">Results you can inspect</text>
  <text x="818" y="1128" class="body">Answers · evidence · citations · verification</text>
  <text x="818" y="1163" class="body">Generated files · artifact references · trace events</text>
  <text x="72" y="1227" class="small">The 12th workflow, example_skill, provides an echo diagnostic. RAG actions run inside reporting workflows.</text>
</svg>
