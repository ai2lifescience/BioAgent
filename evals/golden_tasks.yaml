# Routing fixtures use current model-facing SDK tool names.
- prompt: "download 10 records phiX174 genes A G"
  expected_tools:
    - ncbi_retrieval

- prompt: "Summarize genome structure and host range of PhiX174 with trusted sources."
  expected_tools:
    - pubmed_search
    - web_search
    - evidence_retrieve
    - report_synthesize
  forbidden_tools:
    - report_review

- prompt: "Analyze PhiX174 segment sequence GAGTTTTATCGCTTCCATGACGCAGAAGTTAACACTTTCGGATATTTCTGATGAGTCGAAAAATTATCTT"
  expected_tools:
    - sequence_stats
    - sequence_find_orfs

- prompt: "Show annotations from the latest GenBank file in an interactive genome browser"
  expected_tools:
    - genome_read_features
    - genome_render_map

- prompt: "Search UniProt for BRCA1 human"
  expected_tools:
    - database_lookup
  forbidden_tools:
    - ncbi_retrieval
    - report_synthesize

- prompt: "Download PDB structure 1A3N as cif"
  expected_tools:
    - pdb_download
  forbidden_tools:
    - database_lookup
    - structure_inspect

- prompt: "Analyze structure file runtime/sessions/demo/outputs/structures/1A3N.cif"
  expected_tools:
    - structure_inspect
  forbidden_tools:
    - pdb_download
    - database_lookup

- prompt: "Download PDB structure 3GOU"
  expected_tools:
    - pdb_download
  forbidden_tools:
    - structure_inspect

- prompt: "Calculate GC content and detect ORFs in this FASTA file"
  expected_tools:
    - sequence_stats
    - sequence_find_orfs
  forbidden_tools:
    - file_inspection
    - blast_search

- prompt: "Show the columns and first 20 lines of this TSV file"
  expected_tools:
    - file_inspection
  forbidden_tools:
    - sequence_stats
    - genome_render_map

- prompt: "Find sequences similar to this protein with BLASTP"
  expected_tools:
    - blast_search
  forbidden_tools:
    - sequence_stats
    - ncbi_retrieval

- prompt: "Run the shell template and then summarize its outputs"
  expected_tools:
    - pipeline_specialist
  forbidden_tools:
    - code_test
