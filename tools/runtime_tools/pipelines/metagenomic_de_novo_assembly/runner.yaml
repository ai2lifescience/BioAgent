name: metagenomic_de_novo_assembly
display_name: Metagenomic de novo assembly
description: Assemble metagenomic reads, identify assembled contigs against configured
  reference databases, and produce contig- and species-level reports.
visibility: public
use_when:
- the user wants assembly and downstream identification from metagenomic reads
avoid_when:
- the user only needs read QC or host filtering
input_summary: Single-end or paired-end FASTQ reads plus configured minimap2 indexes,
  annotations, and optional reference FASTA files.
output_summary: Renamed assembled contigs, contig report, species report, and workflow-generated
  alignment artifacts.
limitations: Results depend on configured databases, Docker images, and Cromwell resources.
examples:
- Assemble these metagenomic reads and identify the resulting contigs.
engine: wdl
cromwell_api_version: v1
cromwell_poll_interval: 5
cromwell_visibility_timeout: 300
workflow: assembly_id.wdl
inputs_json: inputs.json
options_json: options.json
timeout: 86400
inputs:
  read1:
    label: Read 1 FASTQ
    wdl_key: AssemblyId.fastq_r1
    required: true
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Read 1 FASTQ input.
  read2:
    label: Read 2 FASTQ
    wdl_key: AssemblyId.fastq_r2
    required: false
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Optional read 2 FASTQ input for paired-end processing.
param_overrides:
  sample_id:
    wdl_key: AssemblyId.sample_id
    default: assembly_sample
  do_evaluate:
    wdl_key: AssemblyId.do_evaluate
    default: true
  megahit_min_contig_len:
    wdl_key: AssemblyId.megahit_min_contig_len
    default: 100
  megahit_k_list:
    wdl_key: AssemblyId.megahit_k_list
    default: 15,21,29,39
  megahit_extra_params:
    wdl_key: AssemblyId.megahit_extra_params
    default: --min-count 1
  minimap2_params:
    wdl_key: AssemblyId.minimap2_params
    default: -x asm20 -N 5
  minimap2_read_params:
    wdl_key: AssemblyId.minimap2_read_params
    default: -ax sr --secondary=no
  max_unique_references:
    wdl_key: AssemblyId.max_unique_references
    default: 100
  metaquast_params:
    wdl_key: AssemblyId.metaquast_params
    default: --no-plots --no-html --no-icarus --fast
  threads:
    wdl_key: AssemblyId.threads
    default: 32
  docker_image:
    wdl_key: AssemblyId.docker_image
    default: cncb/assembly-id:v1.0
outputs:
  contigs:
    label: Renamed assembled contigs
    wdl_output: AssemblyId.final_contigs_renamed
    target: data/output/final.contigs.renamed.fa
    kind: sequence
    required: true
    description: Renamed assembled contigs produced by this workflow.
  contig_report:
    label: Contig identification report
    wdl_output: AssemblyId.contig_report_tsv
    target: data/output/contig_report.tsv
    kind: table
    required: true
    description: Contig identification report produced by this workflow.
  species_report:
    label: Species identification report
    wdl_output: AssemblyId.species_report_tsv
    target: data/output/species_report.tsv
    kind: table
    required: true
    description: Species identification report produced by this workflow.
execution:
  boundary: container
  dependency_scope: pipeline
  engine: wdl
