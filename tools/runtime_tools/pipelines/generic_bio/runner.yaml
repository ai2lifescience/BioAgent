name: generic_bio
description: Educational DNA-analysis demo producing QC metrics, tables and figures; SAM, VCF and consensus
  outputs use a positional comparison, not a validated alignment or variant caller.
engine: shell
entrypoint: run.sh
label: generic_bio_demo
timeout: 120
params:
  sample_id: sample_demo
  min_length: 12
  min_mean_quality: 20.0
  min_base_quality: 20
  min_alt_fraction: 0.6
  min_alt_depth: 2
  plot_dpi: 140
  emit_phylogenetic_tree: true
inputs:
  reads:
    label: Sequencing reads
    config_key: input_path
    required: true
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Single-end DNA reads with Phred+33 quality scores.
  reference:
    label: Reference genome
    config_key: reference_path
    required: true
    accepts:
    - .fasta
    - .fa
    - .fna
    - .fasta.gz
    - .fa.gz
    - .fna.gz
    description: One reference sequence used by the positional comparison demo.
  metadata:
    label: Sample metadata
    config_key: metadata_path
    required: true
    accepts:
    - .tsv
    - .csv
    description: Sample sheet containing a sample_id column.
outputs:
  report:
    label: Analysis report
    config_key: report_path
    default: report.md
    kind: report
  metrics:
    label: QC and analysis metrics
    config_key: metrics_path
    default: metrics.json
    kind: metrics
  html_report:
    label: Interactive-style HTML report
    config_key: html_report_path
    default: report.html
    kind: report
  filtered_reads:
    label: Quality-filtered FASTQ
    config_key: filtered_fastq_path
    default: filtered_reads.fastq
    kind: sequence
  read_qc:
    label: Per-read QC table
    config_key: read_qc_path
    default: read_qc.tsv
    kind: table
  sample_summary:
    label: Sample summary table
    config_key: sample_summary_path
    default: sample_summary.tsv
    kind: table
  coverage:
    label: Per-position coverage table
    config_key: coverage_path
    default: coverage.tsv
    kind: table
  alignments:
    label: Demonstration alignments
    config_key: alignment_sam_path
    default: alignments.sam
    kind: alignment
  consensus:
    label: Consensus sequence
    config_key: consensus_fasta_path
    default: consensus.fasta
    kind: sequence
  variants:
    label: Demonstration variants
    config_key: variants_vcf_path
    default: variants.vcf
    kind: variants
  variant_table:
    label: Variant summary table
    config_key: variant_table_path
    default: variant_summary.tsv
    kind: table
  qc_figure:
    label: Read QC overview figure
    config_key: qc_figure_path
    default: qc_overview.png
    kind: image
  coverage_figure:
    label: Coverage profile figure
    config_key: coverage_figure_path
    default: coverage.png
    kind: image
  variant_figure:
    label: Variant allele fraction figure
    config_key: variant_figure_path
    default: variant_allele_fraction.png
    kind: image
  phylogenetic_tree:
    label: Optional phylogenetic tree
    config_key: phylogenetic_tree_path
    default: phylogenetic_tree.nwk
    kind: phylogenetic_tree
    required: false
  phylogenetic_tree_figure:
    label: Optional phylogenetic tree figure
    config_key: phylogenetic_tree_figure_path
    default: phylogenetic_tree.png
    kind: image
    required: false
