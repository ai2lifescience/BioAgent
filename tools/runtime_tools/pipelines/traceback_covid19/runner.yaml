name: similar-sequence
display_name: COVID-19 Traceback
description: Compare a query sequence with a configured reference, calculate genotype distance with Valkyrie resources, derive an SNP sequence, and build a FastTree tree.
visibility: public
use_when:
- the user has a query FASTA and wants reference-based genotype distance, SNP sequence, and phylogenetic tree results
- the configured Valkyrie and indel resources are available at paths visible to the Cromwell task container
avoid_when:
- the user has raw FASTQ reads that still need quality control or assembly
- the user wants unrestricted clinical interpretation or a general pathogen screen
input_summary: One query FASTA; the reference FASTA, Valkyrie files, and indel information are deployment-managed resources.
output_summary: Combined FASTA, multiple-sequence alignment, mutation list, genotype distance results, SNP sequence, and FastTree Newick tree.
limitations: Results depend on the configured reference and Valkyrie resources, method selection, Docker image, sequence quality, and Cromwell execution. The reference and supporting files must already be visible inside the task container.
examples:
- Compare this query consensus FASTA with the configured reference and build a genotype tree.
- Run WM genotype-distance analysis and return the mutation, SNP, ranking, and tree outputs.
engine: wdl
cromwell_api_version: v1
cromwell_poll_interval: 5
cromwell_visibility_timeout: 300
workflow: workflow.wdl
inputs_json: inputs.json
options_json: options.json
timeout: 86400
resources:
  max_cores: 16
  max_memory_mb: 16384
inputs:
  query_fasta:
    label: Query FASTA
    wdl_key: similar_sequence.query_fasta
    required: true
    accepts:
    - .fasta
    - .fa
    - .fna
    - .fas
    description: Query consensus or assembled nucleotide FASTA.
param_overrides:
  reference_fasta:
    wdl_key: similar_sequence.reference_fasta
    default: /data/zhaomh/program/database/molecular_database/sars/GCF_009858895.2_ASM985889v3_genomic.fna
    description: Mounted reference FASTA used as the first sequence in the alignment.
  d_method:
    wdl_key: similar_sequence.d_method
    label: Genotype distance method
    default: WM
    choices:
    - WM
    - WM+LD
    - UM
    - WM+CL
    - WM+CL+LD
  valkyrie_files:
    wdl_key: similar_sequence.valkyrie_files
    default:
    - /data/zhaomh/program/database/ncov_evolution/public/data/Valkyrie/GenotypeDetailTotal.tsv
    - /data/zhaomh/program/database/ncov_evolution/public/data/Valkyrie/TreeFileLineageDetail.tsv
    - /data/zhaomh/program/database/ncov_evolution/public/data/Valkyrie/Tree_LineageCombined_Total.hotspot
    - /data/zhaomh/program/database/ncov_evolution/public/data/Valkyrie/Tree_LineageCombined_Total.backmutation
    description: Mounted Valkyrie reference files passed as an array to GenotypeDistanceCalculator.
  valkyrie_relative_path_inside_tar:
    wdl_key: similar_sequence.valkyrie_relative_path_inside_tar
    default: Valkyrie
  indel_info:
    wdl_key: similar_sequence.indel_info
    default: /data/zhaomh/program/database/ncov_evolution/public/data/Valkyrie/inDel.info
    description: Mounted indel information file used to create the SNP sequence.
  output_name_prefix:
    wdl_key: similar_sequence.output_name_prefix
    default: SAMPLE
  mafft_threads:
    wdl_key: similar_sequence.mafft_threads
    default: 16
  docker_image:
    wdl_key: similar_sequence.docker_image
    default: cncb/genome_tracing:v1.0
outputs:
  combined_fa:
    label: Combined reference and query FASTA
    wdl_output: similar_sequence.combined_fa
    target: data/output/combined.fa
    kind: sequence
    required: true
    description: Reference and query sequences concatenated before alignment.
  mafft_result:
    label: MAFFT alignment
    wdl_output: similar_sequence.mafft_result
    target: data/output/mafft_result
    kind: alignment
    required: true
    description: Multiple-sequence alignment generated by MAFFT.
  mutation_file:
    label: Mutation list
    wdl_output: similar_sequence.mutation_file
    target: data/output/mutation_result
    kind: text
    required: true
    description: Mutation list generated from the alignment.
  result_tsv:
    label: Genotype distance result
    wdl_output: similar_sequence.result_tsv
    target: data/output/ResultGenotypeRank.tsv
    kind: table
    required: true
    description: Genotype distance ranking result.
  result_mutlist:
    label: Result mutation list
    wdl_output: similar_sequence.result_mutlist
    target: data/output/ResultGenotypeRank.tsv.mutlist
    kind: text
    required: true
    description: Mutation list produced by the genotype distance step.
  snp_fa:
    label: SNP sequence FASTA
    wdl_output: similar_sequence.snp_fa
    target: data/output/ResultGenotypeRank.tsv.mutlist.snp.fa
    kind: sequence
    required: true
    description: SNP sequence derived using the indel information.
  tree_file:
    label: FastTree phylogeny
    wdl_output: similar_sequence.tree_file
    target: data/output/tree_file
    kind: text
    required: true
    description: Newick tree generated by FastTree.
execution:
  boundary: container
  dependency_scope: pipeline
  engine: wdl
