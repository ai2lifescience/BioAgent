name: sequence_qc_demo
description: Demonstrate the local pipeline runtime by validating synthetic FASTQ
  reads, filtering them, and joining sample metadata.
engine: shell
entrypoint: run.sh
timeout: 120
resources:
  max_cores: 1
  max_memory_mb: 1024
params:
  min_length: 6
  max_n_fraction: 0.25
inputs:
  reads:
    label: FASTQ reads
    config_key: input_path
    required: true
    accepts:
    - .fastq
    - .fq
    description: Sequence reads supplied to the workflow.
  metadata:
    label: Read metadata
    config_key: metadata_path
    required: true
    accepts:
    - .tsv
    description: TSV or CSV metadata associated with the sequence input.
outputs:
  report:
    config_key: report_path
    default: report.md
    kind: report
    description: report produced by this workflow.
  metrics:
    config_key: metrics_path
    default: metrics.json
    kind: metrics
    description: metrics produced by this workflow.
  assignments:
    config_key: assignments_path
    default: assignments.tsv
    kind: table
    description: assignments produced by this workflow.
  filtered_reads:
    config_key: filtered_path
    default: filtered.fastq
    kind: sequence
    description: filtered_reads produced by this workflow.
display_name: Sequence QC demonstration
use_when:
- the user explicitly requests a runtime demonstration or smoke test
avoid_when:
- the user needs production bioinformatics analysis
input_summary: Bundled synthetic FASTQ reads and TSV metadata.
output_summary: Filtered reads, assignments, metrics, and report.
limitations: Synthetic educational data only.
examples:
- Run the local pipeline runtime smoke test.
visibility: internal
execution:
  boundary: container
  dependency_scope: pipeline
  engine: shell
