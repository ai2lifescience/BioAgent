name: viral_molecular_typing
display_name: Viral molecular typing
description: Process viral reads, generate a consensus and alignment, and run configured
  Nextclade molecular typing.
visibility: public
use_when:
- the user wants configured influenza or SARS-CoV-2 read processing and typing
avoid_when:
- the user requests an unsupported pathogen or an unrestricted clinical diagnosis
input_summary: Read 1, optional read 2, reference files, Nextclade dataset files,
  and pathogen settings.
output_summary: Typing CSV, Nextclade TSV and JSON, consensus FASTA, and final BAM.
limitations: Results depend on the selected pathogen, references, Nextclade dataset,
  Docker image, and Cromwell execution.
examples:
- Run molecular typing on these viral reads.
engine: wdl
cromwell_api_version: v1
cromwell_poll_interval: 5
cromwell_visibility_timeout: 300
workflow: workflow.wdl
inputs_json: inputs.json
options_json: options.json
timeout: 7200
inputs:
  read1:
    label: Read 1 FASTQ
    wdl_key: run_molecular_typing.file1Path
    required: true
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Read 1 FASTQ input.
  read2:
    label: Read 2 FASTQ
    wdl_key: run_molecular_typing.file2Path
    required: false
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Optional read 2 FASTQ input for paired-end processing.
param_overrides:
  sample:
    wdl_key: run_molecular_typing.sample
    default: molecular_demo_H1N1
  pathogen:
    wdl_key: run_molecular_typing.pathogen
    default: H1N1
  min_length:
    wdl_key: run_molecular_typing.MIN_LENGTH
    default: '35'
  min_qual:
    wdl_key: run_molecular_typing.MIN_QUAL
    default: '20'
  ha_refname:
    wdl_key: run_molecular_typing.HA_REFNAME
    default: NC_026433.1
  threads:
    wdl_key: run_molecular_typing.THREADS
    default: '16'
  docker_image:
    wdl_key: run_molecular_typing.docker_image
    default: cncb/molecular-wdl:v1.0
outputs:
  result_csv:
    label: Typing result CSV
    wdl_output: run_molecular_typing.result_csv
    target: data/output/result.csv
    kind: table
    required: true
    description: Typing result CSV produced by this workflow.
  nextclade_tsv:
    label: Nextclade TSV
    wdl_output: run_molecular_typing.nextclade_tsv
    target: data/output/nextclade.tsv
    kind: table
    required: true
    description: Nextclade TSV produced by this workflow.
  nextclade_json:
    label: Nextclade JSON
    wdl_output: run_molecular_typing.nextclade_json
    target: data/output/nextclade.json
    kind: json
    required: true
    description: Nextclade JSON produced by this workflow.
  consensus_fa:
    label: HA consensus FASTA
    wdl_output: run_molecular_typing.consensus_fa
    target: data/output/consensus.fa
    kind: sequence
    required: true
    description: HA consensus FASTA produced by this workflow.
  final_bam:
    label: Final BAM
    wdl_output: run_molecular_typing.final_bam_out
    target: data/output/final.bam
    kind: alignment
    required: true
    description: Final BAM produced by this workflow.
execution:
  boundary: container
  dependency_scope: pipeline
  engine: wdl
