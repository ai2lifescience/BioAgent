name: bacterial_genome_mutation_analysis
engine: shell
config: config.yaml
entrypoint: run.sh
timeout: 14400
inputs:
  genomes:
    label: Query genome FASTA file or directory
    config_key: input_path
    required: false
    accepts:
    - .fasta
    - .fa
    - .fna
    - .fas
    description: One genome FASTA or a directory of genome FASTA files.
  reference:
    label: Reference genome FASTA (required when reference_mode is local)
    config_key: reference_path
    required: false
    accepts:
    - .fasta
    - .fa
    - .fna
    - .fas
    description: Reference sequence or reference resource used for comparison.
outputs:
  report:
    label: BioAgent Markdown report
    config_key: report_path
    default: data/output/report.md
    kind: report
    required: true
    description: BioAgent Markdown report produced by this workflow.
  metrics:
    label: BioAgent metrics
    config_key: metrics_path
    default: data/output/metrics.json
    kind: metrics
    required: true
    description: BioAgent metrics produced by this workflow.
  matrix:
    label: Filtered SNP alignment
    config_key: matrix_path
    default: data/output/filtered_snp_matrix.fasta
    kind: fasta
    required: true
    description: Filtered SNP alignment produced by this workflow.
  variants:
    label: Annotated variants
    config_key: variants_path
    default: data/output/variants.tsv
    kind: table
    required: true
    description: Annotated variants produced by this workflow.
  variants_summary:
    label: Variant statistics
    config_key: variants_summary_path
    default: data/output/variants_summary.txt
    kind: report
    required: true
    description: Variant statistics produced by this workflow.
  pipeline_summary:
    label: Pipeline summary
    config_key: pipeline_summary_path
    default: data/output/summary.txt
    kind: report
    required: true
    description: Pipeline summary produced by this workflow.
  initial_snps:
    label: SNP calls before filtering
    config_key: initial_snps_path
    default: data/output/initial_snp_list.csv
    kind: table
    required: false
    description: SNP calls before filtering produced by this workflow.
  mutation_report:
    label: Detailed mutation report
    config_key: mutation_report_path
    default: data/output/mutation_report.csv
    kind: table
    required: false
    description: Detailed mutation report produced by this workflow.
  final_tree:
    label: Final phylogenetic tree
    config_key: final_tree_path
    default: data/output/final_tree.nwk
    kind: tree
    required: false
    description: Final phylogenetic tree produced by this workflow.
  treefile:
    label: IQ-TREE tree
    config_key: treefile_path
    default: data/output/iqtree_run.treefile
    kind: tree
    required: false
    description: IQ-TREE tree produced by this workflow.
  iqtree_report:
    label: IQ-TREE report
    config_key: iqtree_report_path
    default: data/output/iqtree_run.iqtree
    kind: report
    required: false
    description: IQ-TREE report produced by this workflow.
  iqtree_log:
    label: IQ-TREE log
    config_key: iqtree_log_path
    default: data/output/iqtree_run.log
    kind: report
    required: false
    description: IQ-TREE log produced by this workflow.
  pipeline_log:
    label: Pipeline execution log
    config_key: pipeline_log_path
    default: data/output/pipeline.log
    kind: report
    required: false
    description: Pipeline execution log produced by this workflow.
param_overrides:
  reference_mode: {}
  species: {}
  taxonid: {}
  threads: {}
  aligner: {}
  min_coverage: {}
  window_size: {}
  step_size: {}
  sd_threshold: {}
  simulate: {}
  simulate_snp_rate: {}
  simulate_samples: {}
  seed: {}
  verbose: {}
display_name: Bacterial genome mutation analysis
description: Compare assembled bacterial genomes against a reference, call and filter
  SNPs, and optionally build a phylogeny.
use_when:
- the user wants mutation comparison or a phylogeny from assembled bacterial genomes
avoid_when:
- the input is raw FASTQ reads
- the user needs clinical interpretation of variants
input_summary: One genome or a directory of genomes, plus a local or database-resolved
  reference.
output_summary: Filtered SNP alignment, variant tables, summaries, metrics, and optional
  tree artifacts.
limitations: Reference resolution and phylogeny require the configured databases and
  external tools.
examples:
- Compare these bacterial assemblies and build a SNP tree.
visibility: public
execution:
  boundary: container
  dependency_scope: pipeline
  engine: shell
