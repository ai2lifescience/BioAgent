name: generic_wdl
description: WDL example that normalizes a FASTA sequence and produces sequence metrics and a report.
engine: wdl
workflow: workflow.wdl
inputs_json: inputs.json
options_json: options.json
timeout: 300
inputs:
  sequence:
    label: Sequence FASTA
    wdl_key: GenericWdl.input_fasta
    required: true
    accepts:
    - .fa
    - .fasta
    - .fna
outputs:
  report:
    label: Report
    wdl_output: GenericWdl.report
    target: report.md
    kind: report
  metrics:
    label: Metrics
    wdl_output: GenericWdl.metrics
    target: metrics.json
    kind: metrics
  normalized_sequence:
    label: Normalized sequence
    wdl_output: GenericWdl.normalized_fasta
    target: normalized.fasta
    kind: sequence
