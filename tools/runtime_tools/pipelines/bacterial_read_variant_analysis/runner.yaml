name: bacterial_read_variant_analysis
engine: shell
config: config.yaml
entrypoint: run.sh
timeout: 28800
inputs:
  reads:
    label: FASTQ read file or directory
    config_key: input_path
    required: true
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Sequence reads supplied to the workflow.
  reference:
    label: Reference genome FASTA (required when reference_mode is local)
    config_key: reference_path
    required: false
    accepts:
    - .fasta
    - .fa
    - .fna
    - .fas
    description: Reference sequence or reference resource used for comparison.
outputs:
  report:
    label: BioAgent Markdown report
    config_key: report_path
    default: data/output/report.md
    kind: report
    required: true
    description: BioAgent Markdown report produced by this workflow.
  metrics:
    label: BioAgent metrics
    config_key: metrics_path
    default: data/output/metrics.json
    kind: metrics
    required: true
    description: BioAgent metrics produced by this workflow.
  matrix:
    label: Filtered SNP matrix
    config_key: matrix_path
    default: data/output/matrix.tsv
    kind: table
    required: true
    description: Filtered SNP matrix produced by this workflow.
  variants:
    label: Annotated variants
    config_key: variants_path
    default: data/output/variants.tsv
    kind: table
    required: true
    description: Annotated variants produced by this workflow.
  variants_summary:
    label: Variant statistics
    config_key: variants_summary_path
    default: data/output/variants_summary.txt
    kind: report
    required: true
    description: Variant statistics produced by this workflow.
  final_tree:
    label: Final phylogenetic tree
    config_key: final_tree_path
    default: data/output/final_tree.nwk
    kind: tree
    required: false
    description: Final phylogenetic tree produced by this workflow.
  tree_alignment:
    label: Tree alignment
    config_key: tree_alignment_path
    default: data/output/tree.fasta
    kind: fasta
    required: false
    description: Tree alignment produced by this workflow.
  treefile:
    label: IQ-TREE tree
    config_key: treefile_path
    default: data/output/tree.treefile
    kind: tree
    required: false
    description: IQ-TREE tree produced by this workflow.
  iqtree_report:
    label: IQ-TREE report
    config_key: iqtree_report_path
    default: data/output/tree.iqtree
    kind: report
    required: false
    description: IQ-TREE report produced by this workflow.
  iqtree_log:
    label: IQ-TREE log
    config_key: iqtree_log_path
    default: data/output/tree.log
    kind: report
    required: false
    description: IQ-TREE log produced by this workflow.
  pipeline_log:
    label: Pipeline execution log
    config_key: pipeline_log_path
    default: data/output/pipeline.log
    kind: report
    required: false
    description: Pipeline execution log produced by this workflow.
param_overrides:
  reference_mode: {}
  species: {}
  taxonid: {}
  threads: {}
  min_coverage: {}
  window_size: {}
  step_size: {}
  sd_threshold: {}
  verbose: {}
display_name: Bacterial read variant analysis
description: Map bacterial reads to a reference, call and filter variants, build a
  cross-sample SNP matrix, and optionally infer a phylogeny.
use_when:
- the user wants variant comparison from bacterial FASTQ reads
avoid_when:
- the user has assembled genomes instead of reads
- the user asks for clinical variant interpretation
input_summary: Single-end or paired-end bacterial FASTQ data and a local or database-resolved
  reference.
output_summary: Variant tables, SNP matrix, QC metrics, alignment artifacts, summaries,
  and optional tree files.
limitations: Results depend on reference quality, coverage, database configuration,
  and external tool versions.
examples:
- Call and compare bacterial variants from these reads.
visibility: public
execution:
  boundary: container
  dependency_scope: pipeline
  engine: shell
