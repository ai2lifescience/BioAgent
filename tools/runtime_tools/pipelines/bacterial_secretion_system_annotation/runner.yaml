name: bacterial_secretion_systems
display_name: Bacterial secretion system annotation
description: Identify bacterial secretion systems and associated genes from an assembled genome FASTA or raw reads with MacSyFinder TXSScan.
visibility: public
use_when:
- the user wants bacterial secretion-system annotation or TXSScan results
- the user has an assembled genome FASTA or single-end/paired-end sequencing reads
avoid_when:
- the user only needs read quality control, taxonomic identification, or biosynthetic gene cluster detection
- the user wants defense-system or general functional annotation
input_summary: One required genome FASTA or read 1 FASTQ as the main input, an optional read 2 FASTQ for metagenome mode, and a mounted TXSScan models directory.
output_summary: Secretion-system calls and secretion-associated gene tables.
limitations: Set input_type to genome for an assembled FASTA or metagenome for read 1 with optional read 2. Metagenome mode runs fastp and MEGAHIT before MacSyFinder. The TXSScan models directory and the BacSec image must be available to the Cromwell task container.
examples:
- Find bacterial secretion systems in this genome FASTA.
- Assemble these metagenomic reads and run TXSScan secretion-system annotation.
engine: wdl
cromwell_api_version: v1
cromwell_poll_interval: 5
cromwell_visibility_timeout: 300
workflow: workflow.wdl
inputs_json: inputs.json
options_json: options.json
timeout: 86400
resources:
  max_cores: 8
  max_memory_mb: 49152
inputs:
  sequence_file1:
    label: Main sequence file
    wdl_key: BacSec.file1Path
    required: true
    accepts:
    - .fasta
    - .fa
    - .fna
    - .fas
    - .fasta.gz
    - .fa.gz
    - .fna.gz
    - .fas.gz
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Assembled genome FASTA in genome mode, or read 1 FASTQ in metagenome mode.
  sequence_file2:
    label: Read 2 FASTQ (optional)
    wdl_key: BacSec.file2Path
    required: false
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Optional paired-end read 2 used only in metagenome mode.
param_overrides:
  input_type:
    wdl_key: BacSec.input_type
    label: Input type
    required: true
    choices:
    - genome
    - metagenome
  sample_id:
    wdl_key: BacSec.sample_id
    default: GCF_000006765.1_ASM676v1_genomic
  txsscan_models_dir:
    wdl_key: BacSec.txsscan_models_dir
    default: /data/zhaomh/program/database/bac_database/models/TXSScan_compat
    description: Mounted TXSScan_compat models directory.
  docker_image:
    wdl_key: BacSec.docker_image
    default: cncb/bacsec:v2
  threads:
    wdl_key: BacSec.threads
    default: 8
  min_contig_length:
    wdl_key: BacSec.min_contig_length
    default: 1000
  genome_context:
    wdl_key: BacSec.genome_context
    default: auto
    choices:
    - auto
    - complete
    - metagenome
  memory_gb:
    wdl_key: BacSec.memory_gb
    default: 48
  disk_gb:
    wdl_key: BacSec.disk_gb
    default: 150
outputs:
  secretion_systems:
    label: Secretion systems
    wdl_output: BacSec.secretion_systems
    target: data/output/secretion_systems.tsv
    kind: table
    required: true
    description: MacSyFinder TXSScan secretion-system calls.
  secretion_genes:
    label: Secretion genes
    wdl_output: BacSec.secretion_genes
    target: data/output/secretion_genes.tsv
    kind: table
    required: true
    description: Genes associated with detected secretion systems.
execution:
  boundary: container
  dependency_scope: pipeline
  engine: wdl