name: kmer-detection
display_name: Metagenomic pathogen identification based kmer
description: Classify cleaned metagenomic reads with StrobeTaxa k-mer and strobemer signatures.
visibility: public
use_when:
- the user has cleaned FASTQ reads and wants k-mer or strobemer based taxonomic detection
- the StrobeTaxa database is available at a path visible to the Cromwell task container
avoid_when:
- the user still needs read quality control or adapter trimming
- the user needs assembly, pathogen strain identification, or clinical interpretation
input_summary: One required cleaned R1 FASTQ, an optional cleaned R2 FASTQ, and a deployment-managed StrobeTaxa database directory.
output_summary: Classified reads TSV, classification report TSV, and signature coverage CSV.
limitations: Results depend on the StrobeTaxa database, clean-read quality, Docker image, resource allocation, and Cromwell execution. The database directory must already be mounted into the task container.
examples:
- Run k-mer detection on these cleaned metagenomic reads.
- Classify this paired-end read set with the configured StrobeTaxa database.
engine: wdl
cromwell_api_version: v1
cromwell_poll_interval: 5
cromwell_visibility_timeout: 300
workflow: workflow.wdl
inputs_json: inputs.json
options_json: options.json
timeout: 14400
resources:
  max_cores: 32
  max_memory_mb: 65536
inputs:
  clean_r1:
    label: Clean reads R1
    wdl_key: StrobeTaxaDetection.clean_r1
    required: true
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Required cleaned single-end or paired-end R1 reads.
  clean_r2:
    label: Clean reads R2
    wdl_key: StrobeTaxaDetection.clean_r2
    required: false
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Optional cleaned paired-end R2 reads.
param_overrides:
  sample_id:
    wdl_key: StrobeTaxaDetection.sample_id
    default: SAMPLE
  db_dir:
    wdl_key: StrobeTaxaDetection.db_dir
    default: /data/zhaomh/program/database/kmer_database/nt25_c16k8
    description: StrobeTaxa database directory already visible inside the Cromwell task container.
  feat3_threshold:
    wdl_key: StrobeTaxaDetection.feat3_threshold
    default: 0.5
  bp_per_block:
    wdl_key: StrobeTaxaDetection.bp_per_block
    default: 1000000
  memmap:
    wdl_key: StrobeTaxaDetection.memmap
    default: true
  docker_image:
    wdl_key: StrobeTaxaDetection.docker_image
    default: cncb/strobe-taxa:v1.0
  cpu:
    wdl_key: StrobeTaxaDetection.cpu
    default: 32
  memory_gb:
    wdl_key: StrobeTaxaDetection.memory_gb
    default: 64
  disk_gb:
    wdl_key: StrobeTaxaDetection.disk_gb
    default: 200
outputs:
  classified_tsv:
    label: Classified reads TSV
    wdl_output: StrobeTaxaDetection.classified_tsv
    target: data/output/classified.tsv
    kind: table
    required: true
    description: Per-read or per-signature classification table.
  report_tsv:
    label: Classification report TSV
    wdl_output: StrobeTaxaDetection.report_tsv
    target: data/output/report.tsv
    kind: table
    required: true
    description: StrobeTaxa classification summary report.
  signature_coverage_csv:
    label: Signature coverage CSV
    wdl_output: StrobeTaxaDetection.signature_coverage_csv
    target: data/output/signature_coverage.csv
    kind: table
    required: true
    description: Signature coverage metrics produced by StrobeTaxa.
execution:
  boundary: container
  dependency_scope: pipeline
  engine: wdl
