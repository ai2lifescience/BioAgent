name: metax_profiling
display_name: MetaX classification abundance analysis
description: Profile a single microbial sample with MetaX and return its taxonomic profile from short reads or an input sequence file.
visibility: public
use_when:
- the user wants MetaX taxonomic profiling for a single sample
- the user has single-end or paired-end reads and the MetaX database is mounted
avoid_when:
- the user needs read quality control, host removal, or de novo assembly
- the user wants clinical interpretation or variant calling
input_summary: Required input sequence file, optional paired read 2, and mounted MetaX database and taxonomy resources.
output_summary: One MetaX profile text table.
limitations: The MetaX database JSON and optional NCBI taxdump must be visible inside the Cromwell task container. This workflow runs MetaX directly and does not perform upstream read QC or assembly.
examples:
- Profile this paired-end metagenomic sample with MetaX.
- Run MetaX on this single-end sequence file and return the taxonomic profile.
engine: wdl
cromwell_api_version: v1
cromwell_poll_interval: 5
cromwell_visibility_timeout: 300
workflow: workflow.wdl
inputs_json: inputs.json
options_json: options.json
timeout: 86400
resources:
  max_cores: 20
  max_memory_mb: 65536
inputs:
  reads:
    label: Input sequence or read 1
    wdl_key: metax.reads
    required: true
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    - .fasta
    - .fa
    - .fasta.gz
    - .fa.gz
    description: Required input sequence file. Use this for single-end reads, paired-end read 1, or an input FASTA accepted by MetaX.
  reads2:
    label: Read 2 FASTQ
    wdl_key: metax.reads2
    required: false
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Optional paired-end read 2. When provided, MetaX is run in paired mode.
param_overrides:
  db:
    wdl_key: metax.db
    default: /data/zhaomh/program/database/metax/metax_newdb/metax-abfph_cc-v_ccs-refseq_202509/metax-abfphv.json
    description: Mounted MetaX database JSON.
  dmp_dir:
    wdl_key: metax.dmp_dir
    default: /data/zhaomh/program/database/metax/taxonomy
    description: Mounted NCBI taxdump directory containing nodes.dmp, names.dmp, and merged.dmp.
  sequencer:
    wdl_key: metax.sequencer
    default: Illumina
  mode:
    wdl_key: metax.mode
    default: default
  strain:
    wdl_key: metax.strain
    default: false
  lowbiomass:
    wdl_key: metax.lowbiomass
    default: false
  genus_fallback:
    wdl_key: metax.genus_fallback
    default: false
  strict:
    wdl_key: metax.strict
    default: false
  keep_raw:
    wdl_key: metax.keep_raw
    default: false
  compress_sam:
    wdl_key: metax.compress_sam
    default: false
  by_aligned:
    wdl_key: metax.by_aligned
    default: false
  resume:
    wdl_key: metax.resume
    default: false
  reuse_sam:
    wdl_key: metax.reuse_sam
    default: null
    description: Optional existing SAM path for MetaX resume or reuse.
  pathogen_host:
    wdl_key: metax.pathogen_host
    default: null
  host:
    wdl_key: metax.host
    default: null
  identity:
    wdl_key: metax.identity
    default: null
  mapped_len:
    wdl_key: metax.mapped_len
    default: null
  fraction:
    wdl_key: metax.fraction
    default: null
  min_breadth:
    wdl_key: metax.min_breadth
    default: null
  min_cbreadth:
    wdl_key: metax.min_cbreadth
    default: null
  min_reads:
    wdl_key: metax.min_reads
    default: null
  min_oebr:
    wdl_key: metax.min_oebr
    default: null
  min_coebr:
    wdl_key: metax.min_coebr
    default: null
  threads:
    wdl_key: metax.threads
    default: 20
  memory_gb:
    wdl_key: metax.memory_gb
    default: 64
  disk_gb:
    wdl_key: metax.disk_gb
    default: 100
  docker:
    wdl_key: metax.docker
    default: metax:0.9.23-beta
outputs:
  profile:
    label: MetaX profile
    wdl_output: metax.profile
    target: data/output/profile.txt
    kind: table
    required: true
    description: Taxonomic profile text table generated by MetaX.
execution:
  boundary: container
  dependency_scope: pipeline
  engine: wdl
