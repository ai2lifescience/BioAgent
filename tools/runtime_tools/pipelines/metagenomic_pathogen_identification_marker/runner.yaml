name: strain-meta
display_name: Metagenomic pathogen identification based marker
description: Profile metagenomic reads with MetaPhlAn and generate sample marker and alignment outputs for downstream strain analysis.
visibility: public
use_when:
- the user has single-end or paired-end metagenomic FASTQ reads and wants MetaPhlAn-based community or strain profiling
- the configured MetaPhlAn database is available at a path visible to the Cromwell task container
avoid_when:
- the user still needs read quality control, adapter trimming, or host removal
- the user wants de novo assembly, broad pathogen screening, or clinical risk interpretation
input_summary: Required read 1, optional read 2, MetaPhlAn database settings, and sample metadata.
output_summary: MetaPhlAn profile, compressed SAM alignment, and consensus marker file.
limitations: Results depend on read quality, MetaPhlAn database release, database visibility, Docker image, and Cromwell execution. This workflow does not perform upstream read QC.
examples:
- Profile this paired-end metagenomic sample with the configured MetaPhlAn database.
- Run single-end MetaPhlAn strain profiling and return the profile and marker outputs.
engine: wdl
cromwell_api_version: v1
cromwell_poll_interval: 5
cromwell_visibility_timeout: 300
workflow: workflow.wdl
inputs_json: inputs.json
options_json: options.json
timeout: 86400
resources:
  max_cores: 16
  max_memory_mb: 65536
inputs:
  read1:
    label: Read 1 FASTQ
    wdl_key: StrainMeta.fastq_r1
    required: true
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Required single-end read or paired-end read 1.
  read2:
    label: Read 2 FASTQ
    wdl_key: StrainMeta.fastq_r2
    required: false
    accepts:
    - .fastq
    - .fq
    - .fastq.gz
    - .fq.gz
    description: Optional paired-end read 2.
param_overrides:
  sample_id:
    wdl_key: StrainMeta.sample_id
    default: SAMPLE
  data_type:
    wdl_key: StrainMeta.data_type
    default: metagenome
  metaphlan_db_dir:
    wdl_key: StrainMeta.metaphlan_db_dir
    default: /data/zhaomh/program/database/strain_database/metaphlan
    description: Mounted MetaPhlAn database directory.
  metaphlan_db_index:
    wdl_key: StrainMeta.metaphlan_db_index
    default: mpa_vJan25_CHOCOPhlAnSGB_202503
    description: MetaPhlAn database index basename used to locate the .pkl file.
  threads:
    wdl_key: StrainMeta.threads
    default: 16
  docker_image:
    wdl_key: StrainMeta.docker_image
    default: cncb/strain-meta:v1.0
  cpu:
    wdl_key: StrainMeta.cpu
    default: 16
  memory_gb:
    wdl_key: StrainMeta.memory_gb
    default: 64
  disk_gb:
    wdl_key: StrainMeta.disk_gb
    default: 500
outputs:
  profile:
    label: MetaPhlAn profile
    wdl_output: StrainMeta.profile
    target: data/output/profile.txt
    kind: table
    required: true
    description: MetaPhlAn profile generated for the sample.
  sam_bz2:
    label: Compressed SAM alignment
    wdl_output: StrainMeta.sam_bz2
    target: data/output/sam.bz2
    kind: file
    required: true
    description: Compressed MetaPhlAn alignment output.
  consensus_marker:
    label: Consensus marker file
    wdl_output: StrainMeta.consensus_marker
    target: data/output/consensus_marker.json.bz2
    kind: file
    required: true
    description: Consensus marker output generated by the MetaPhlAn helper script.
execution:
  boundary: container
  dependency_scope: pipeline
  engine: wdl

